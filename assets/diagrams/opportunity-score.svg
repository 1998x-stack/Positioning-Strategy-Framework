<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Positioning Opportunity Scorecard</title><desc id="desc">Seven weighted criteria and hard gates for evaluating positioning opportunities.</desc>
<defs><style>.bg{fill:#f7f8fb}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.head{font:700 26px Arial,sans-serif;fill:#17324d}.label{font:700 16px Arial,sans-serif;fill:#17324d}.body{font:14px Arial,sans-serif;fill:#526477}.bar{fill:#dce8f1}.fill{fill:#5b86a6}.gate{fill:#fff3e4;stroke:#dfb57c;stroke-width:1.5}</style></defs>
<rect class="bg" width="1200" height="700" rx="24"/><text class="head" x="600" y="56" text-anchor="middle">POSITIONING OPPORTUNITY SCORECARD</text><text class="body" x="600" y="84" text-anchor="middle">Weighted judgment model · 1–5 score · evidence and hard gates required</text>
<rect class="panel" x="65" y="120" width="700" height="500" rx="18"/><text class="label" x="100" y="165">Evaluation dimension</text><text class="label" x="700" y="165" text-anchor="end">Weight</text>
<text class="body" x="100" y="220">Customer relevance</text><rect class="bar" x="310" y="200" width="300" height="22" rx="8"/><rect class="fill" x="310" y="200" width="300" height="22" rx="8"/><text class="label" x="700" y="220" text-anchor="end">20%</text>
<text class="body" x="100" y="278">Distinctiveness</text><rect class="bar" x="310" y="258" width="300" height="22" rx="8"/><rect class="fill" x="310" y="258" width="225" height="22" rx="8"/><text class="label" x="700" y="278" text-anchor="end">15%</text>
<text class="body" x="100" y="336">Credibility and proof</text><rect class="bar" x="310" y="316" width="300" height="22" rx="8"/><rect class="fill" x="310" y="316" width="225" height="22" rx="8"/><text class="label" x="700" y="336" text-anchor="end">15%</text>
<text class="body" x="100" y="394">Strategic fit</text><rect class="bar" x="310" y="374" width="300" height="22" rx="8"/><rect class="fill" x="310" y="374" width="225" height="22" rx="8"/><text class="label" x="700" y="394" text-anchor="end">15%</text>
<text class="body" x="100" y="452">Economic potential</text><rect class="bar" x="310" y="432" width="300" height="22" rx="8"/><rect class="fill" x="310" y="432" width="225" height="22" rx="8"/><text class="label" x="700" y="452" text-anchor="end">15%</text>
<text class="body" x="100" y="510">Defensibility</text><rect class="bar" x="310" y="490" width="300" height="22" rx="8"/><rect class="fill" x="310" y="490" width="150" height="22" rx="8"/><text class="label" x="700" y="510" text-anchor="end">10%</text>
<text class="body" x="100" y="568">Execution readiness</text><rect class="bar" x="310" y="548" width="300" height="22" rx="8"/><rect class="fill" x="310" y="548" width="150" height="22" rx="8"/><text class="label" x="700" y="568" text-anchor="end">10%</text>
<rect class="gate" x="805" y="120" width="330" height="500" rx="18"/><text class="head" x="970" y="165" text-anchor="middle">Hard gates</text><text class="body" x="845" y="225">A high score cannot override:</text><text class="body" x="845" y="270">• No meaningful customer need</text><text class="body" x="845" y="315">• No credible proof or delivery</text><text class="body" x="845" y="360">• Unviable unit economics</text><text class="body" x="845" y="405">• Legal, safety, or ethical barrier</text><text class="body" x="845" y="450">• Incomprehensible category</text><text class="label" x="970" y="530" text-anchor="middle">Score ≠ decision</text><text class="body" x="970" y="560" text-anchor="middle">Explain evidence, uncertainty,</text><text class="body" x="970" y="583" text-anchor="middle">counter-evidence, and trade-offs.</text>
<text class="body" x="600" y="665" text-anchor="middle">Bar lengths illustrate weights only; actual scores are project-specific.</text></svg>
