<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Customer Mind Map Model</title><desc id="desc">Three complementary views: category ladder, brand association network, and perceptual map.</desc>
<defs><style>.bg{fill:#f7f8fb}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.head{font:700 22px Arial,sans-serif;fill:#17324d}.label{font:700 16px Arial,sans-serif;fill:#17324d}.body{font:14px Arial,sans-serif;fill:#526477}.node{fill:#e8f0f7;stroke:#9db3c7;stroke-width:1.5}.accent{fill:#e7f4ec;stroke:#9bbda5;stroke-width:1.5}.line{stroke:#8aa0b4;stroke-width:2;fill:none}</style></defs>
<rect class="bg" width="1200" height="700" rx="24"/><text class="head" x="600" y="52" text-anchor="middle">CUSTOMER MIND MAP · THREE DISTINCT VIEWS</text>
<rect class="panel" x="40" y="100" width="350" height="520" rx="18"/><text class="head" x="215" y="142" text-anchor="middle">1. Mind ladder</text><text class="body" x="215" y="170" text-anchor="middle">Who comes to mind first?</text>
<rect class="accent" x="95" y="215" width="240" height="68" rx="12"/><text class="label" x="215" y="245" text-anchor="middle">Brand A · First recall</text><text class="body" x="215" y="267" text-anchor="middle">Illustrative only</text>
<rect class="node" x="95" y="310" width="240" height="68" rx="12"/><text class="label" x="215" y="340" text-anchor="middle">Brand B · Next recall</text><text class="body" x="215" y="362" text-anchor="middle">Illustrative only</text>
<rect class="node" x="95" y="405" width="240" height="68" rx="12"/><text class="label" x="215" y="435" text-anchor="middle">Brand C · Other choice</text><text class="body" x="215" y="457" text-anchor="middle">Illustrative only</text>
<text class="body" x="215" y="530" text-anchor="middle">Measure recall, awareness,</text><text class="body" x="215" y="553" text-anchor="middle">and consideration separately.</text>
<rect class="panel" x="425" y="100" width="350" height="520" rx="18"/><text class="head" x="600" y="142" text-anchor="middle">2. Association network</text><text class="body" x="600" y="170" text-anchor="middle">What does each brand mean?</text>
<circle class="accent" cx="600" cy="330" r="64"/><text class="label" x="600" y="335" text-anchor="middle">Brand A</text><path class="line" d="M555 285 L500 230 M645 285 L700 230 M550 375 L490 440 M650 375 L710 440"/>
<rect class="node" x="450" y="195" width="112" height="52" rx="10"/><text class="body" x="506" y="226" text-anchor="middle">Attribute</text><rect class="node" x="638" y="195" width="112" height="52" rx="10"/><text class="body" x="694" y="226" text-anchor="middle">Scenario</text><rect class="node" x="440" y="430" width="112" height="52" rx="10"/><text class="body" x="496" y="461" text-anchor="middle">Emotion</text><rect class="node" x="648" y="430" width="112" height="52" rx="10"/><text class="body" x="704" y="461" text-anchor="middle">Proof</text>
<text class="body" x="600" y="535" text-anchor="middle">Record positive and negative</text><text class="body" x="600" y="558" text-anchor="middle">associations with their sources.</text>
<rect class="panel" x="810" y="100" width="350" height="520" rx="18"/><text class="head" x="985" y="142" text-anchor="middle">3. Perceptual map</text><text class="body" x="985" y="170" text-anchor="middle">How are alternatives perceived?</text>
<path class="line" d="M875 500 V220 M875 500 H1110 M875 360 H1110 M990 220 V500" stroke-dasharray="5 5"/><text class="body" x="990" y="535" text-anchor="middle">Dimension 1 — research-derived</text><text class="body" x="845" y="360" transform="rotate(-90 845 360)" text-anchor="middle">Dimension 2</text>
<circle cx="930" cy="285" r="12" fill="#17324d"/><text class="body" x="950" y="280">Brand A</text><circle cx="1050" cy="420" r="12" fill="#557f9f"/><text class="body" x="1068" y="415">Brand B</text><circle cx="970" cy="455" r="12" fill="#6a9b7b"/><text class="body" x="990" y="480">Brand C</text><text class="body" x="985" y="580" text-anchor="middle">Axes must be measured, not invented.</text>
<text class="body" x="600" y="665" text-anchor="middle">All brands and positions are illustrative; never present as market data.</text></svg>
