<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Positioning Strategy Framework</title><desc id="desc">A research-led process from decision framing to market research, mind maps, positioning options, strategic fit, validation, and iteration.</desc>
<defs><style>.bg{fill:#f7f8fb}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.primary{fill:#17324d}.secondary{fill:#e8f0f7}.green{fill:#e7f4ec}.title{font:700 28px Arial,sans-serif;fill:#17324d}.label{font:700 18px Arial,sans-serif;fill:#17324d}.small{font:14px Arial,sans-serif;fill:#526477}.line{stroke:#59758d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#59758d"/></marker></defs>
<rect class="bg" width="1200" height="760" rx="24"/><text class="title" x="600" y="54" text-anchor="middle">POSITIONING STRATEGY FRAMEWORK</text><text class="small" x="600" y="82" text-anchor="middle">Outside-in research · competitive choice · proof · delivery · validation</text>
<rect class="card" x="410" y="112" width="380" height="76" rx="14"/><text class="label" x="600" y="143" text-anchor="middle">01 · Frame the decision</text><text class="small" x="600" y="166" text-anchor="middle">Audience · market · objective · constraints</text>
<path class="line" marker-end="url(#arrow)" d="M600 188 V220"/><rect class="secondary" x="410" y="226" width="380" height="76" rx="14"/><text class="label" x="600" y="257" text-anchor="middle">02 · Research the market</text><text class="small" x="600" y="280" text-anchor="middle">Category · customer jobs · substitutes</text>
<path class="line" marker-end="url(#arrow)" d="M600 302 V334"/><rect class="card" x="410" y="340" width="380" height="76" rx="14"/><text class="label" x="600" y="371" text-anchor="middle">03 · Map the mind</text><text class="small" x="600" y="394" text-anchor="middle">Mind ladder · associations · competitors</text>
<path class="line" marker-end="url(#arrow)" d="M600 416 V448"/><rect class="secondary" x="410" y="454" width="380" height="76" rx="14"/><text class="label" x="600" y="485" text-anchor="middle">04 · Choose a position</text><text class="small" x="600" y="508" text-anchor="middle">Options · opportunity score · trade-offs</text>
<path class="line" marker-end="url(#arrow)" d="M600 530 V562"/><rect class="green" x="410" y="568" width="380" height="76" rx="14"/><text class="label" x="600" y="599" text-anchor="middle">05 · Deliver and validate</text><text class="small" x="600" y="622" text-anchor="middle">Product · price · channel · economics · tests</text>
<path class="line" marker-end="url(#arrow)" d="M600 644 V682 H980 V340 H800"/><text class="small" x="988" y="510" transform="rotate(-90 988 510)" text-anchor="middle">Learn and iterate</text>
<rect class="card" x="60" y="250" width="260" height="140" rx="14"/><text class="label" x="190" y="284" text-anchor="middle">Evidence discipline</text><text class="small" x="190" y="315" text-anchor="middle">Source quality</text><text class="small" x="190" y="340" text-anchor="middle">Causal attribution</text><text class="small" x="190" y="365" text-anchor="middle">Counter-evidence</text><path class="line" d="M320 320 H385"/>
<rect class="card" x="880" y="250" width="260" height="140" rx="14"/><text class="label" x="1010" y="284" text-anchor="middle">Decision outputs</text><text class="small" x="1010" y="315" text-anchor="middle">Positioning statement</text><text class="small" x="1010" y="340" text-anchor="middle">Strategic-fit audit</text><text class="small" x="1010" y="365" text-anchor="middle">Validation roadmap</text><path class="line" d="M815 376 H880"/>
<text class="small" x="600" y="726" text-anchor="middle">A positioning statement is a hypothesis until customers understand it and the business can deliver it.</text></svg>
