name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python scripts/validate_repo.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate synthetic case
        run: python scripts/validate_case.py examples/industrial-compressor-case.json
      - name: Score synthetic case
        run: python scripts/score_opportunity.py examples/industrial-compressor-case.json
